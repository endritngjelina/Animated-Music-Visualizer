<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-wrapper:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn.active {
            background: rgba(64, 224, 208, 0.3);
            border-color: rgba(64, 224, 208, 0.5);
        }

        select {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            outline: none;
        }

        select option {
            background: #222;
            color: white;
        }

        .slider {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #40e0d0;
            border-radius: 50%;
            cursor: pointer;
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: right;
            z-index: 100;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #40e0d0, #ff6b6b, #4ecdc4);
            width: 0%;
            transition: width 0.1s ease;
            z-index: 100;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .loading.show {
            opacity: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="visualizer"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label class="file-input-wrapper">
                    <input type="file" id="audioFile" class="file-input" accept="audio/*">
                    🎵 Load Audio
                </label>
                <button id="playPause" class="btn">▶ Play</button>
            </div>
            
            <div class="control-group">
                <select id="visualMode">
                    <option value="particles">Particle Symphony</option>
                    <option value="bars">Frequency Bars</option>
                    <option value="waves">Audio Waves</option>
                    <option value="spiral">Spiral Galaxy</option>
                    <option value="matrix">Digital Matrix</option>
                    <option value="kaleidoscope">Kaleidoscope</option>
                </select>
            </div>
            
            <div class="control-group">
                <select id="colorTheme">
                    <option value="neon">Neon Dreams</option>
                    <option value="fire">Fire Storm</option>
                    <option value="ocean">Ocean Depths</option>
                    <option value="space">Deep Space</option>
                    <option value="rainbow">Rainbow Burst</option>
                    <option value="aurora">Aurora Borealis</option>
                </select>
            </div>
            
            <div class="control-group">
                <label style="color: white; font-size: 12px;">Sensitivity</label>
                <input type="range" id="sensitivity" class="slider" min="0.1" max="3" step="0.1" value="1">
            </div>
            
            <div class="control-group">
                <label style="color: white; font-size: 12px;">Particles</label>
                <input type="range" id="particleCount" class="slider" min="50" max="500" step="25" value="200">
            </div>
        </div>
        
        <div class="info">
            <div id="audioInfo">No audio loaded</div>
            <div id="fpsCounter">FPS: 0</div>
        </div>
        
        <div class="progress-bar" id="progressBar"></div>
        <div class="loading" id="loading">Loading audio...</div>
    </div>

    <script>
        class MusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new Audio();
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.source = null;
                this.isPlaying = false;
                this.animationId = null;
                
                this.particles = [];
                this.visualMode = 'particles';
                this.colorTheme = 'neon';
                this.sensitivity = 1;
                this.particleCount = 200;
                
                this.time = 0;
                this.lastTime = 0;
                this.fps = 0;
                this.frameCount = 0;
                
                this.init();
            }
            
            init() {
                this.resizeCanvas();
                this.setupEventListeners();
                this.createParticles();
                this.animate();
                
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            setupEventListeners() {
                document.getElementById('audioFile').addEventListener('change', (e) => this.loadAudio(e));
                document.getElementById('playPause').addEventListener('click', () => this.togglePlay());
                document.getElementById('visualMode').addEventListener('change', (e) => {
                    this.visualMode = e.target.value;
                    this.createParticles();
                });
                document.getElementById('colorTheme').addEventListener('change', (e) => {
                    this.colorTheme = e.target.value;
                });
                document.getElementById('sensitivity').addEventListener('input', (e) => {
                    this.sensitivity = parseFloat(e.target.value);
                });
                document.getElementById('particleCount').addEventListener('input', (e) => {
                    this.particleCount = parseInt(e.target.value);
                    this.createParticles();
                });
                
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('ended', () => this.onAudioEnd());
            }
            
            async loadAudio(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                document.getElementById('loading').classList.add('show');
                
                try {
                    const url = URL.createObjectURL(file);
                    this.audio.src = url;
                    
                    await new Promise((resolve, reject) => {
                        this.audio.onloadedmetadata = resolve;
                        this.audio.onerror = reject;
                    });
                    
                    this.setupAudioContext();
                    
                    document.getElementById('audioInfo').textContent = `${file.name} • ${this.formatTime(this.audio.duration)}`;
                    document.getElementById('loading').classList.remove('show');
                    
                } catch (error) {
                    console.error('Error loading audio:', error);
                    document.getElementById('loading').classList.remove('show');
                }
            }
            
            setupAudioContext() {
                if (this.audioContext) {
                    this.audioContext.close();
                }
                
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 512;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                this.source = this.audioContext.createMediaElementSource(this.audio);
                this.source.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);
            }
            
            togglePlay() {
                if (!this.audio.src) return;
                
                if (this.isPlaying) {
                    this.audio.pause();
                    this.isPlaying = false;
                    document.getElementById('playPause').textContent = '▶ Play';
                } else {
                    this.audio.play();
                    this.isPlaying = true;
                    document.getElementById('playPause').textContent = '⏸ Pause';
                }
            }
            
            onAudioEnd() {
                this.isPlaying = false;
                document.getElementById('playPause').textContent = '▶ Play';
            }
            
            updateProgress() {
                if (this.audio.duration) {
                    const progress = (this.audio.currentTime / this.audio.duration) * 100;
                    document.getElementById('progressBar').style.width = `${progress}%`;
                }
            }
            
            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            createParticles() {
                this.particles = [];
                
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        angle: Math.random() * Math.PI * 2,
                        baseSize: Math.random() * 3 + 1,
                        hue: Math.random() * 360
                    });
                }
            }
            
            getColorPalette() {
                const palettes = {
                    neon: ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b'],
                    fire: ['#ff4757', '#ff3838', '#ff9ff3', '#ffa502', '#ff6348'],
                    ocean: ['#0abde3', '#006ba6', '#0052cc', '#74b9ff', '#00cec9'],
                    space: ['#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055'],
                    rainbow: ['#ff0000', '#ff8000', '#ffff00', '#00ff00', '#0080ff', '#8000ff'],
                    aurora: ['#00ff87', '#60efff', '#ff87d4', '#ff8060', '#ffd700']
                };
                return palettes[this.colorTheme] || palettes.neon;
            }
            
            animate() {
                this.animationId = requestAnimationFrame(() => this.animate());
                
                const currentTime = performance.now();
                this.time = currentTime * 0.001;
                
                // Calculate FPS
                if (currentTime - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastTime));
                    document.getElementById('fpsCounter').textContent = `FPS: ${this.fps}`;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }
                this.frameCount++;
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.analyser && this.isPlaying) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.visualize();
                } else {
                    this.visualizeIdle();
                }
            }
            
            visualize() {
                const colors = this.getColorPalette();
                
                switch (this.visualMode) {
                    case 'particles':
                        this.drawParticles(colors);
                        break;
                    case 'bars':
                        this.drawFrequencyBars(colors);
                        break;
                    case 'waves':
                        this.drawWaves(colors);
                        break;
                    case 'spiral':
                        this.drawSpiral(colors);
                        break;
                    case 'matrix':
                        this.drawMatrix(colors);
                        break;
                    case 'kaleidoscope':
                        this.drawKaleidoscope(colors);
                        break;
                }
            }
            
            visualizeIdle() {
                const colors = this.getColorPalette();
                
                this.particles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;
                    
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    this.ctx.fillStyle = color + '40';
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
            
            drawParticles(colors) {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.particles.forEach((particle, i) => {
                    const freqIndex = Math.floor((i / this.particles.length) * this.dataArray.length);
                    const amplitude = (this.dataArray[freqIndex] / 255) * this.sensitivity;
                    
                    particle.size = particle.baseSize + amplitude * 10;
                    
                    const distance = Math.sqrt((particle.x - centerX) ** 2 + (particle.y - centerY) ** 2);
                    const force = amplitude * 2;
                    
                    particle.vx += (centerX - particle.x) / distance * force * 0.01;
                    particle.vy += (centerY - particle.y) / distance * force * 0.01;
                    
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                    
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;
                    
                    const colorIndex = Math.floor(amplitude * colors.length);
                    const color = colors[Math.min(colorIndex, colors.length - 1)];
                    const alpha = Math.max(0.3, amplitude);
                    
                    this.ctx.shadowBlur = amplitude * 20;
                    this.ctx.shadowColor = color;
                    this.ctx.fillStyle = color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                });
            }
            
            drawFrequencyBars(colors) {
                const barWidth = this.canvas.width / this.dataArray.length;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const amplitude = (this.dataArray[i] / 255) * this.sensitivity;
                    const barHeight = amplitude * this.canvas.height * 0.8;
                    
                    const x = i * barWidth;
                    const y = this.canvas.height - barHeight;
                    
                    const colorIndex = Math.floor((i / this.dataArray.length) * colors.length);
                    const color = colors[colorIndex];
                    
                    this.ctx.shadowBlur = amplitude * 30;
                    this.ctx.shadowColor = color;
                    
                    const gradient = this.ctx.createLinearGradient(x, y, x, this.canvas.height);
                    gradient.addColorStop(0, color);
                    gradient.addColorStop(1, color + '40');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, y, barWidth - 1, barHeight);
                    this.ctx.shadowBlur = 0;
                }
            }
            
            drawWaves(colors) {
                const centerY = this.canvas.height / 2;
                
                for (let wave = 0; wave < colors.length; wave++) {
                    this.ctx.strokeStyle = colors[wave];
                    this.ctx.lineWidth = 3;
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = colors[wave];
                    
                    this.ctx.beginPath();
                    
                    for (let i = 0; i < this.dataArray.length; i++) {
                        const amplitude = (this.dataArray[i] / 255) * this.sensitivity;
                        const x = (i / this.dataArray.length) * this.canvas.width;
                        const y = centerY + Math.sin((i * 0.05) + (this.time * 2) + (wave * Math.PI / 3)) * amplitude * 100;
                        
                        if (i === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                    }
                    
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;
                }
            }
            
            drawSpiral(colors) {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.ctx.save();
                this.ctx.translate(centerX, centerY);
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const amplitude = (this.dataArray[i] / 255) * this.sensitivity;
                    const angle = (i / this.dataArray.length) * Math.PI * 8 + this.time;
                    const radius = amplitude * 200 + i * 2;
                    
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    
                    const colorIndex = Math.floor((i / this.dataArray.length) * colors.length);
                    const color = colors[colorIndex];
                    
                    this.ctx.fillStyle = color + Math.floor(amplitude * 255).toString(16).padStart(2, '0');
                    this.ctx.shadowBlur = amplitude * 20;
                    this.ctx.shadowColor = color;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, amplitude * 8 + 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                }
                
                this.ctx.restore();
            }
            
            drawMatrix(colors) {
                const cols = 50;
                const rows = 30;
                const cellWidth = this.canvas.width / cols;
                const cellHeight = this.canvas.height / rows;
                
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const freqIndex = Math.floor(((i + j) / (cols + rows)) * this.dataArray.length);
                        const amplitude = (this.dataArray[freqIndex] / 255) * this.sensitivity;
                        
                        if (amplitude > 0.3) {
                            const x = i * cellWidth;
                            const y = j * cellHeight;
                            
                            const colorIndex = Math.floor(amplitude * colors.length);
                            const color = colors[Math.min(colorIndex, colors.length - 1)];
                            
                            this.ctx.fillStyle = color + Math.floor(amplitude * 255).toString(16).padStart(2, '0');
                            this.ctx.fillRect(x, y, cellWidth, cellHeight);
                        }
                    }
                }
            }
            
            drawKaleidoscope(colors) {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const segments = 8;
                
                this.ctx.save();
                this.ctx.translate(centerX, centerY);
                
                for (let segment = 0; segment < segments; segment++) {
                    this.ctx.save();
                    this.ctx.rotate((segment / segments) * Math.PI * 2);
                    
                    for (let i = 0; i < this.dataArray.length / segments; i++) {
                        const amplitude = (this.dataArray[i] / 255) * this.sensitivity;
                        const radius = i * 3;
                        const size = amplitude * 15 + 2;
                        
                        const colorIndex = Math.floor((i / (this.dataArray.length / segments)) * colors.length);
                        const color = colors[colorIndex];
                        
                        this.ctx.fillStyle = color + Math.floor(amplitude * 255).toString(16).padStart(2, '0');
                        this.ctx.shadowBlur = amplitude * 15;
                        this.ctx.shadowColor = color;
                        
                        this.ctx.beginPath();
                        this.ctx.arc(radius, 0, size, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.beginPath();
                        this.ctx.arc(radius, 0, size, 0, Math.PI * 2);
                        this.ctx.scale(1, -1);
                        this.ctx.fill();
                        this.ctx.scale(1, -1);
                        this.ctx.shadowBlur = 0;
                    }
                    
                    this.ctx.restore();
                }
                
                this.ctx.restore();
            }
        }
        
        // Initialize the visualizer
        const visualizer = new MusicVisualizer();
        
        // Add some demo instructions
        if (!window.AudioContext && !window.webkitAudioContext) {
            document.getElementById('audioInfo').textContent = 'Web Audio API not supported';
        }
    </script>
</body>
</html>
