<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Music Visualizer</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(145deg, #667eea, #764ba2);
            --accent-gradient: linear-gradient(145deg, #ff6b6b, #ff8e53);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-primary: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
            --blur: blur(15px);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 16px;
            --border-radius-small: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-gradient);
            color: white;
            overflow: hidden;
            user-select: none;
            font-weight: 400;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #visualizer {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.3) 100%);
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #audio-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(145deg, #667eea, #764ba2);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #7689ea, #8659c2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background: linear-gradient(145deg, #ff6b6b, #ff8e53);
        }

        #theme-selector, #mode-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(5px);
        }

        #theme-selector option, #mode-selector option {
            background: #2a2a2a;
            color: white;
        }

        #progress-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
        }

        #progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        #track-info {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .settings-panel {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .slider {
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(145deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(145deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .slider-label {
            font-size: 10px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(10px);
        }

        .demo-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 18px;
            opacity: 0.7;
            z-index: 50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .feature-badge {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            #controls {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .settings-panel {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <div id="audio-controls">
                <input type="file" id="file-input" accept="audio/*">
                <button class="btn" id="load-btn">Load Audio</button>
                <button class="btn" id="play-btn">Play/Pause</button>
                <button class="btn" id="demo-btn">Demo Mode</button>
            </div>
            
            <div class="settings-panel">
                <select id="theme-selector">
                    <option value="neon">Neon Spectrum</option>
                    <option value="ocean">Ocean Waves</option>
                    <option value="fire">Fire Storm</option>
                    <option value="galaxy">Galaxy</option>
                    <option value="matrix">Matrix</option>
                    <option value="aurora">Aurora</option>
                </select>
                
                <select id="mode-selector">
                    <option value="bars">Frequency Bars</option>
                    <option value="particles">Particle System</option>
                    <option value="waves">Wave Form</option>
                    <option value="circular">Circular</option>
                    <option value="mandala">Mandala</option>
                    <option value="hybrid">Hybrid Mode</option>
                </select>
                
                <div class="slider-container">
                    <input type="range" class="slider" id="sensitivity" min="0.1" max="3" step="0.1" value="1">
                    <label class="slider-label">Sensitivity</label>
                </div>
                
                <div class="slider-container">
                    <input type="range" class="slider" id="smoothing" min="0" max="0.9" step="0.1" value="0.8">
                    <label class="slider-label">Smoothing</label>
                </div>
                
                <div class="slider-container">
                    <input type="range" class="slider" id="particles-count" min="50" max="500" step="25" value="200">
                    <label class="slider-label">Particles</label>
                </div>
            </div>
        </div>

        <div id="visualizer">
            <canvas id="canvas"></canvas>
            <div class="demo-message" id="demo-message">
                🎵 Load an audio file or try Demo Mode 🎵
            </div>
        </div>

        <div id="progress-container">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="track-info">No track loaded</div>
        </div>

        <div id="fps-counter">FPS: <span id="fps">60</span></div>
        
        <div class="feature-badge">
            🚀 Professional Audio Visualizer v2.0<br>
            WebAudio API • Canvas 2D • Real-time Analysis
        </div>
    </div>

    <script>
        class MusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = null;
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.source = null;
                this.isPlaying = false;
                this.animationId = null;
                
                // Visual settings
                this.theme = 'neon';
                this.mode = 'bars';
                this.sensitivity = 1;
                this.smoothing = 0.8;
                this.particlesCount = 200;
                
                // Particles system
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                
                // Performance monitoring
                this.frameCount = 0;
                this.lastTime = performance.now();
                this.fps = 60;
                
                // Demo mode
                this.demoMode = false;
                this.demoTime = 0;
                
                this.init();
                this.setupEventListeners();
                this.resize();
                this.createParticles();
                this.animate();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
                
                this.width = rect.width;
                this.height = rect.height;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
            }

            setupEventListeners() {
                // File input
                document.getElementById('file-input').addEventListener('change', (e) => {
                    this.loadAudio(e.target.files[0]);
                });

                document.getElementById('load-btn').addEventListener('click', () => {
                    document.getElementById('file-input').click();
                });

                document.getElementById('play-btn').addEventListener('click', () => {
                    this.togglePlayPause();
                });

                document.getElementById('demo-btn').addEventListener('click', () => {
                    this.toggleDemo();
                });

                // Theme and mode selectors
                document.getElementById('theme-selector').addEventListener('change', (e) => {
                    this.theme = e.target.value;
                });

                document.getElementById('mode-selector').addEventListener('change', (e) => {
                    this.mode = e.target.value;
                    this.createParticles(); // Recreate particles for new mode
                });

                // Sliders
                document.getElementById('sensitivity').addEventListener('input', (e) => {
                    this.sensitivity = parseFloat(e.target.value);
                });

                document.getElementById('smoothing').addEventListener('input', (e) => {
                    this.smoothing = parseFloat(e.target.value);
                    if (this.analyser) {
                        this.analyser.smoothingTimeConstant = this.smoothing;
                    }
                });

                document.getElementById('particles-count').addEventListener('input', (e) => {
                    this.particlesCount = parseInt(e.target.value);
                    this.createParticles();
                });

                // Mouse tracking
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                });

                // Progress bar
                document.getElementById('progress-bar').addEventListener('click', (e) => {
                    if (this.audio) {
                        const rect = e.target.getBoundingClientRect();
                        const progress = (e.clientX - rect.left) / rect.width;
                        this.audio.currentTime = this.audio.duration * progress;
                    }
                });
            }

            async loadAudio(file) {
                if (!file) return;

                try {
                    // Clean up previous audio
                    if (this.audio) {
                        this.audio.pause();
                        this.audio = null;
                    }

                    if (this.source) {
                        this.source.disconnect();
                    }

                    // Create new audio context if needed
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    // Create audio element
                    this.audio = new Audio();
                    this.audio.src = URL.createObjectURL(file);
                    this.audio.crossOrigin = "anonymous";

                    // Setup audio analysis
                    this.source = this.audioContext.createMediaElementSource(this.audio);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.analyser.smoothingTimeConstant = this.smoothing;

                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                    // Update track info
                    document.getElementById('track-info').textContent = file.name;
                    document.getElementById('demo-message').style.display = 'none';

                    // Setup progress tracking
                    this.audio.addEventListener('timeupdate', () => {
                        if (this.audio.duration) {
                            const progress = (this.audio.currentTime / this.audio.duration) * 100;
                            document.getElementById('progress-fill').style.width = progress + '%';
                        }
                    });

                    this.audio.addEventListener('ended', () => {
                        this.isPlaying = false;
                        document.getElementById('play-btn').textContent = 'Play/Pause';
                        document.getElementById('play-btn').classList.remove('active');
                    });

                    this.demoMode = false;
                    document.getElementById('demo-btn').classList.remove('active');

                } catch (error) {
                    console.error('Error loading audio:', error);
                    alert('Error loading audio file. Please try a different file.');
                }
            }

            togglePlayPause() {
                if (!this.audio && !this.demoMode) {
                    alert('Please load an audio file first or try Demo Mode!');
                    return;
                }

                if (this.audio) {
                    if (this.isPlaying) {
                        this.audio.pause();
                        document.getElementById('play-btn').classList.remove('active');
                    } else {
                        // Resume audio context if needed
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                        this.audio.play();
                        document.getElementById('play-btn').classList.add('active');
                    }
                    this.isPlaying = !this.isPlaying;
                }
            }

            toggleDemo() {
                this.demoMode = !this.demoMode;
                
                if (this.demoMode) {
                    if (this.audio) {
                        this.audio.pause();
                        this.isPlaying = false;
                    }
                    document.getElementById('demo-btn').classList.add('active');
                    document.getElementById('track-info').textContent = 'Demo Mode - Procedural Audio';
                    document.getElementById('demo-message').style.display = 'none';
                    
                    // Create demo analyser
                    if (!this.analyser) {
                        this.analyser = { frequencyBinCount: 1024 };
                        this.dataArray = new Uint8Array(1024);
                    }
                } else {
                    document.getElementById('demo-btn').classList.remove('active');
                    if (!this.audio) {
                        document.getElementById('track-info').textContent = 'No track loaded';
                        document.getElementById('demo-message').style.display = 'block';
                    }
                }
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.particlesCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        life: Math.random(),
                        decay: Math.random() * 0.02 + 0.005,
                        angle: Math.random() * Math.PI * 2,
                        frequency: Math.floor(Math.random() * (this.dataArray ? this.dataArray.length : 512))
                    });
                }
            }

            getThemeColors(intensity) {
                const themes = {
                    neon: [
                        `rgba(${255 * intensity}, ${100 * intensity}, ${255 * intensity}, 0.8)`,
                        `rgba(${100 * intensity}, ${255 * intensity}, ${255 * intensity}, 0.6)`,
                        `rgba(${255 * intensity}, ${255 * intensity}, ${100 * intensity}, 0.4)`
                    ],
                    ocean: [
                        `rgba(${100 * intensity}, ${200 * intensity}, ${255 * intensity}, 0.8)`,
                        `rgba(${50 * intensity}, ${150 * intensity}, ${200 * intensity}, 0.6)`,
                        `rgba(${0 * intensity}, ${100 * intensity}, ${150 * intensity}, 0.4)`
                    ],
                    fire: [
                        `rgba(${255 * intensity}, ${100 * intensity}, ${50 * intensity}, 0.8)`,
                        `rgba(${255 * intensity}, ${150 * intensity}, ${0 * intensity}, 0.6)`,
                        `rgba(${200 * intensity}, ${50 * intensity}, ${0 * intensity}, 0.4)`
                    ],
                    galaxy: [
                        `rgba(${200 * intensity}, ${100 * intensity}, ${255 * intensity}, 0.8)`,
                        `rgba(${100 * intensity}, ${50 * intensity}, ${200 * intensity}, 0.6)`,
                        `rgba(${255 * intensity}, ${200 * intensity}, ${100 * intensity}, 0.4)`
                    ],
                    matrix: [
                        `rgba(${100 * intensity}, ${255 * intensity}, ${100 * intensity}, 0.8)`,
                        `rgba(${50 * intensity}, ${200 * intensity}, ${50 * intensity}, 0.6)`,
                        `rgba(${0 * intensity}, ${150 * intensity}, ${0 * intensity}, 0.4)`
                    ],
                    aurora: [
                        `rgba(${100 * intensity}, ${255 * intensity}, ${200 * intensity}, 0.8)`,
                        `rgba(${200 * intensity}, ${100 * intensity}, ${255 * intensity}, 0.6)`,
                        `rgba(${255 * intensity}, ${200 * intensity}, ${100 * intensity}, 0.4)`
                    ]
                };
                return themes[this.theme] || themes.neon;
            }

            generateDemoData() {
                if (!this.dataArray) return;
                
                this.demoTime += 0.05;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    // Create procedural audio-like data
                    const wave1 = Math.sin(this.demoTime * 2 + i * 0.02) * 128 + 128;
                    const wave2 = Math.sin(this.demoTime * 3 + i * 0.01) * 64;
                    const wave3 = Math.sin(this.demoTime * 1.5 + i * 0.03) * 32;
                    const noise = Math.random() * 20;
                    
                    this.dataArray[i] = Math.max(0, Math.min(255, wave1 + wave2 + wave3 + noise));
                }
            }

            draw() {
                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                if (!this.dataArray) return;

                // Get audio data or generate demo data
                if (this.demoMode) {
                    this.generateDemoData();
                } else if (this.analyser && this.analyser.getByteFrequencyData) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                }

                // Calculate average intensity
                const avgIntensity = this.dataArray.reduce((sum, val) => sum + val, 0) / this.dataArray.length / 255;
                
                switch (this.mode) {
                    case 'bars':
                        this.drawBars();
                        break;
                    case 'particles':
                        this.drawParticles();
                        break;
                    case 'waves':
                        this.drawWaves();
                        break;
                    case 'circular':
                        this.drawCircular();
                        break;
                    case 'mandala':
                        this.drawMandala();
                        break;
                    case 'hybrid':
                        this.drawHybrid();
                        break;
                }

                // Add reactive background effects
                this.drawBackgroundEffects(avgIntensity);
            }

            drawBars() {
                const barWidth = this.width / this.dataArray.length * 2;
                const colors = this.getThemeColors(1);
                
                for (let i = 0; i < this.dataArray.length / 2; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.height * this.sensitivity;
                    const x = i * barWidth;
                    
                    // Create gradient
                    const gradient = this.ctx.createLinearGradient(0, this.height, 0, this.height - barHeight);
                    gradient.addColorStop(0, colors[0]);
                    gradient.addColorStop(0.5, colors[1]);
                    gradient.addColorStop(1, colors[2]);
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, this.height - barHeight, barWidth - 1, barHeight);
                    
                    // Mirror effect
                    this.ctx.fillRect(x, 0, barWidth - 1, barHeight);
                }
            }

            drawParticles() {
                const colors = this.getThemeColors(1);
                
                this.particles.forEach((particle, index) => {
                    const freqData = this.dataArray[particle.frequency] / 255;
                    const intensity = freqData * this.sensitivity;
                    
                    // Update particle
                    particle.x += particle.vx * (1 + intensity);
                    particle.y += particle.vy * (1 + intensity);
                    particle.size = (1 + intensity * 3) * (particle.life + 0.5);
                    
                    // Boundary collision
                    if (particle.x < 0 || particle.x > this.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.height) particle.vy *= -1;
                    
                    // Mouse interaction
                    const dx = this.mouseX - particle.x;
                    const dy = this.mouseY - particle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        particle.vx += dx * 0.0001;
                        particle.vy += dy * 0.0001;
                    }
                    
                    // Draw particle
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.life * intensity;
                    this.ctx.fillStyle = colors[index % colors.length];
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Add glow effect
                    this.ctx.shadowColor = colors[index % colors.length];
                    this.ctx.shadowBlur = particle.size * 2;
                    this.ctx.fill();
                    
                    this.ctx.restore();
                    
                    // Update life
                    particle.life -= particle.decay;
                    if (particle.life <= 0) {
                        particle.life = 1;
                        particle.x = Math.random() * this.width;
                        particle.y = Math.random() * this.height;
                    }
                });
            }

            drawWaves() {
                const colors = this.getThemeColors(1);
                
                this.ctx.strokeStyle = colors[0];
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                
                const sliceWidth = this.width / this.dataArray.length;
                let x = 0;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const v = this.dataArray[i] / 128.0;
                    const y = v * this.height / 2 * this.sensitivity;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, this.centerY + y);
                    } else {
                        this.ctx.lineTo(x, this.centerY + y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
                
                // Mirror wave
                this.ctx.strokeStyle = colors[1];
                this.ctx.beginPath();
                x = 0;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const v = this.dataArray[i] / 128.0;
                    const y = v * this.height / 2 * this.sensitivity;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, this.centerY - y);
                    } else {
                        this.ctx.lineTo(x, this.centerY - y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
            }

            drawCircular() {
                const colors = this.getThemeColors(1);
                const radius = Math.min(this.width, this.height) * 0.3;
                
                this.ctx.save();
                this.ctx.translate(this.centerX, this.centerY);
                
                for (let i = 0; i < this.dataArray.length / 4; i++) {
                    const angle = (i / (this.dataArray.length / 4)) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * radius * this.sensitivity;
                    
                    const x = Math.cos(angle) * (radius + amplitude);
                    const y = Math.sin(angle) * (radius + amplitude);
                    
                    // Draw line from center
                    this.ctx.strokeStyle = colors[i % colors.length];
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                    
                    // Add glowing dot at the end
                    this.ctx.fillStyle = colors[i % colors.length];
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                this.ctx.restore();
            }

            drawMandala() {
                const colors = this.getThemeColors(1);
                const centerRadius = 50;
                const maxRadius = Math.min(this.width, this.height) * 0.4;
                
                this.ctx.save();
                this.ctx.translate(this.centerX, this.centerY);
                
                // Draw multiple layers
                for (let layer = 0; layer < 3; layer++) {
                    const layerRadius = centerRadius + (layer * 60);
                    const segments = 32 + (layer * 16);
                    
                    for (let i = 0; i < segments; i++) {
                        const angle = (i / segments) * Math.PI * 2;
                        const dataIndex = Math.floor((i / segments) * this.dataArray.length);
                        const amplitude = (this.dataArray[dataIndex] / 255) * this.sensitivity;
                        
                        const innerRadius = layerRadius;
                        const outerRadius = layerRadius + (amplitude * 80);
                        
                        // Create petal shape
                        this.ctx.fillStyle = colors[layer % colors.length];
                        this.ctx.globalAlpha = 0.6;
                        this.ctx.beginPath();
                        
                        for (let j = 0; j < 20; j++) {
                            const petalAngle = angle + (j / 20) * (Math.PI / segments) * 2;
                            const radius = innerRadius + (Math.sin(j / 20 * Math.PI) * (outerRadius - innerRadius));
                            const x = Math.cos(petalAngle) * radius;
                            const y = Math.sin(petalAngle) * radius;
                            
                            if (j === 0) {
                                this.ctx.moveTo(x, y);
                            } else {
                                this.ctx.lineTo(x, y);
                            }
                        }
                        
                        this.ctx.closePath();
                        this.ctx.fill();
                    }
                }
                
                this.ctx.restore();
            }

            drawHybrid() {
                // Combine multiple visualization modes
                this.ctx.globalAlpha = 0.7;
                this.drawCircular();
                
                this.ctx.globalAlpha = 0.4;
                this.drawParticles();
                
                this.ctx.globalAlpha = 0.5;
                this.drawWaves();
                
                this.ctx.globalAlpha = 1.0;
            }

            drawBackgroundEffects(intensity) {
                // Pulsating background
                const pulseIntensity = intensity * this.sensitivity;
                
                // Create radial gradient based on audio
                const gradient = this.ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, Math.max(this.width, this.height)
                );
                
                const colors = this.getThemeColors(pulseIntensity);
                gradient.addColorStop(0, `rgba(${Math.floor(pulseIntensity * 50)}, ${Math.floor(pulseIntensity * 30)}, ${Math.floor(pulseIntensity * 70)}, 0.1)`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                this.ctx.globalCompositeOperation = 'screen';
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.ctx.globalCompositeOperation = 'source-over';
                
                // Edge glow effect
                if (intensity > 0.3) {
                    this.ctx.shadowColor = colors[0];
                    this.ctx.shadowBlur = intensity * 20;
                    this.ctx.strokeStyle = colors[0];
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(5, 5, this.width - 10, this.height - 10);
                    this.ctx.shadowBlur = 0;
                }
            }

            updateFPS() {
                this.frameCount++;
                const now = performance.now();
                const delta = now - this.lastTime;
                
                if (delta >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / delta);
                    document.getElementById('fps').textContent = this.fps;
                    this.frameCount = 0;
                    this.lastTime = now;
                }
            }

            animate() {
                this.draw();
                this.updateFPS();
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                if (this.audio) {
                    this.audio.pause();
                    this.audio = null;
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
            }
        }

            setupKeyboardShortcuts() {
                document.addEventListener('keydown', (e) => {

                        case 'KeyD':
                            if (e.ctrlKey || e.metaKey) {

                            }
                            break;
                        case 'KeyL':
                            if (e.ctrlKey || e.metaKey) {

                            }
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.adjustSensitivity(0.1);
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.adjustSensitivity(-0.1);

        // Advanced audio analysis features
        class AudioAnalysisEngine {
            constructor(visualizer) {
                this.visualizer = visualizer;
                this.beatDetection = new BeatDetection();
                this.spectrumAnalyzer = new SpectrumAnalyzer();
                this.setupAdvancedAnalysis();
            }

            setupAdvancedAnalysis() {
                // Real-time audio feature extraction
                setInterval(() => {
                    if (this.visualizer.dataArray) {
                        const features = this.extractFeatures();
                        this.visualizer.audioFeatures = features;
                    }
                }, 100);
            }

            extractFeatures() {
                const data = this.visualizer.dataArray;
                if (!data) return {};

                return {
                    rms: this.calculateRMS(data),
                    spectralCentroid: this.calculateSpectralCentroid(data),
                    spectralRolloff: this.calculateSpectralRolloff(data),
                    zeroCrossingRate: this.calculateZeroCrossingRate(data),
                    mfcc: this.calculateMFCC(data),
                    beat: this.beatDetection.detect(data),
                    tempo: this.beatDetection.getTempo(),
                    key: this.detectKey(data),
                    mood: this.analyzeMood(data)
                };
            }

            calculateRMS(data) {
                const sum = data.reduce((acc, val) => acc + val * val, 0);
                return Math.sqrt(sum / data.length) / 255;
            }

            calculateSpectralCentroid(data) {
                let weightedSum = 0;
                let magnitudeSum = 0;
                
                for (let i = 0; i < data.length; i++) {
                    weightedSum += i * data[i];
                    magnitudeSum += data[i];
                }
                
                return magnitudeSum > 0 ? weightedSum / magnitudeSum : 0;
            }

            calculateSpectralRolloff(data) {
                const totalEnergy = data.reduce((sum, val) => sum + val, 0);
                const threshold = totalEnergy * 0.85;
                
                let cumulativeEnergy = 0;
                for (let i = 0; i < data.length; i++) {
                    cumulativeEnergy += data[i];
                    if (cumulativeEnergy >= threshold) {
                        return i / data.length;
                    }
                }
                return 1;
            }

            calculateZeroCrossingRate(data) {
                let crossings = 0;
                for (let i = 1; i < data.length; i++) {
                    if ((data[i] >= 128 && data[i-1] < 128) || (data[i] < 128 && data[i-1] >= 128)) {
                        crossings++;
                    }
                }
                return crossings / data.length;
            }

            calculateMFCC(data) {
                // Simplified MFCC calculation
                const mfcc = [];
                const melFilters = this.createMelFilterBank(data.length);
                
                for (let i = 0; i < 13; i++) {
                    let coefficient = 0;
                    for (let j = 0; j < data.length; j++) {
                        coefficient += data[j] * melFilters[i][j];
                    }
                    mfcc.push(coefficient / data.length);
                }
                
                return mfcc;
            }

            createMelFilterBank(fftSize) {
                const filters = [];
                const melMax = this.hzToMel(22050);
                const melMin = this.hzToMel(0);
                const numFilters = 13;
                
                for (let i = 0; i < numFilters; i++) {
                    const filter = new Array(fftSize).fill(0);
                    const melCenter = melMin + (i + 1) * (melMax - melMin) / (numFilters + 1);
                    const hzCenter = this.melToHz(melCenter);
                    const binCenter = Math.floor(hzCenter * fftSize / 44100);
                    
                    // Triangular filter
                    for (let j = Math.max(0, binCenter - 10); j < Math.min(fftSize, binCenter + 10); j++) {
                        filter[j] = 1 - Math.abs(j - binCenter) / 10;
                    }
                    
                    filters.push(filter);
                }
                
                return filters;
            }

            hzToMel(hz) {
                return 2595 * Math.log10(1 + hz / 700);
            }

            melToHz(mel) {
                return 700 * (Math.pow(10, mel / 2595) - 1);
            }

            detectKey(data) {
                // Simplified key detection using chromagram
                const chroma = new Array(12).fill(0);
                
                for (let i = 0; i < data.length; i++) {
                    const note = i % 12;
                    chroma[note] += data[i];
                }
                
                const maxIdx = chroma.indexOf(Math.max(...chroma));
                const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                return keys[maxIdx];
            }

            analyzeMood(data) {
                const features = {
                    energy: this.calculateRMS(data),
                    brightness: this.calculateSpectralCentroid(data) / data.length,
                    rhythm: this.beatDetection.getStrength()
                };
                
                // Simple mood classification
                if (features.energy > 0.7 && features.brightness > 0.6) return 'energetic';
                if (features.energy < 0.3 && features.brightness < 0.4) return 'calm';
                if (features.rhythm > 0.8) return 'danceable';
                if (features.brightness > 0.7) return 'bright';
                return 'neutral';
            }
        }

        // Beat detection algorithm
        class BeatDetection {
            constructor() {
                this.energyHistory = [];
                this.beatHistory = [];
                this.tempo = 120;
                this.lastBeatTime = 0;
            }

            detect(data) {
                const currentEnergy = data.reduce((sum, val) => sum + val * val, 0) / data.length;
                this.energyHistory.push(currentEnergy);
                
                if (this.energyHistory.length > 43) { // ~1 second of history at 43Hz
                    this.energyHistory.shift();
                }
                
                const avgEnergy = this.energyHistory.reduce((sum, val) => sum + val, 0) / this.energyHistory.length;
                const variance = this.energyHistory.reduce((sum, val) => sum + Math.pow(val - avgEnergy, 2), 0) / this.energyHistory.length;
                const threshold = avgEnergy + 0.1 * Math.sqrt(variance);
                
                const isBeat = currentEnergy > threshold && currentEnergy > avgEnergy * 1.5;
                
                if (isBeat) {
                    const currentTime = performance.now();
                    if (currentTime - this.lastBeatTime > 200) { // Minimum 200ms between beats
                        this.beatHistory.push(currentTime);
                        this.lastBeatTime = currentTime;
                        this.updateTempo();
                    }
                }
                
                return isBeat;
            }

            updateTempo() {
                if (this.beatHistory.length > 8) {
                    this.beatHistory = this.beatHistory.slice(-8); // Keep last 8 beats
                }
                
                if (this.beatHistory.length >= 4) {
                    const intervals = [];
                    for (let i = 1; i < this.beatHistory.length; i++) {
                        intervals.push(this.beatHistory[i] - this.beatHistory[i-1]);
                    }
                    
                    const avgInterval = intervals.reduce((sum, val) => sum + val, 0) / intervals.length;
                    this.tempo = Math.round(60000 / avgInterval); // Convert to BPM
                    this.tempo = Math.max(60, Math.min(200, this.tempo)); // Clamp to reasonable range
                }
            }

            getTempo() {
                return this.tempo;
            }

            getStrength() {
                return this.energyHistory.length > 0 ? 
                    this.energyHistory[this.energyHistory.length - 1] / 255 : 0;
            }
        }

        // Spectrum analyzer for detailed frequency analysis
        class SpectrumAnalyzer {
            constructor() {
                this.frequencyBands = this.createFrequencyBands();
            }

            createFrequencyBands() {
                return {
                    bass: { min: 0, max: 4 },      // 0-250 Hz
                    lowMid: { min: 4, max: 16 },   // 250-1000 Hz
                    midrange: { min: 16, max: 64 }, // 1000-4000 Hz
                    highMid: { min: 64, max: 128 }, // 4000-8000 Hz
                    treble: { min: 128, max: 256 }  // 8000+ Hz
                };
            }

            analyze(data) {
                const bands = {};
                
                for (const [bandName, range] of Object.entries(this.frequencyBands)) {
                    let sum = 0;
                    let count = 0;
                    
                    for (let i = range.min; i < Math.min(range.max, data.length); i++) {
                        sum += data[i];
                        count++;
                    }
                    
                    bands[bandName] = count > 0 ? sum / count / 255 : 0;
                }
                
                return bands;
            }
        }
