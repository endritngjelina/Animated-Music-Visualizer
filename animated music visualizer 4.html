<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: var(--primary-gradient);
            color: white;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.2) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 24px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 16px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: none;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .btn {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: white;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(10px) saturate(120%);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-soft);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .btn.active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn:disabled:hover {
            background: var(--glass-bg);
            transform: none;
            box-shadow: var(--shadow-soft);
        }

        .select-wrapper {
            position: relative;
            display: inline-block;
        }

        select {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: white;
            padding: 12px 40px 12px 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            outline: none;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: var(--transition-smooth);
            appearance: none;
            min-width: 140px;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            transition: var(--transition-smooth);
        }

        select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .select-wrapper:hover::after {
            color: white;
            transform: translateY(-50%) rotate(180deg);
        }

        select option {
            background: rgba(30, 30, 30, 0.95);
            color: white;
            padding: 8px;
            border: none;
            backdrop-filter: blur(10px);
        }

        .visualizer-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
            filter: contrast(1.1) saturate(1.2);
        }

        .stats {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 20px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            min-width: 200px;
            animation: slideInLeft 0.6s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .stats div {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats span {
            font-weight: 600;
            color: #4ecdc4;
        }

        .progress-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 600px;
            background: var(--glass-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: var(--transition-smooth);
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-bar:hover {
            transform: scaleY(1.5);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b 0%, #4ecdc4 50%, #45b7d1 100%);
            width: 0%;
            transition: width 0.15s ease-out;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            animation: progressShine 3s infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .fullscreen-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: white;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-soft);
            animation: fadeInScale 0.6s ease-out 0.4s both;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.15) rotate(90deg);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: var(--border-radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.02);
            }
        }

        .loading.hidden {
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top: 4px solid #4ecdc4;
            border-right: 4px solid #ff6b6b;
            width: 40px;
            height: 40px;
            animation: spinGradient 1.5s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spinGradient {
            0% { 
                transform: rotate(0deg);
                border-top-color: #4ecdc4;
                border-right-color: #ff6b6b;
            }
            25% { 
                border-top-color: #45b7d1;
                border-right-color: #4ecdc4;
            }
            50% { 
                transform: rotate(180deg);
                border-top-color: #ff6b6b;
                border-right-color: #45b7d1;
            }
            75% { 
                border-top-color: #4ecdc4;
                border-right-color: #ff6b6b;
            }
            100% { 
                transform: rotate(360deg);
                border-top-color: #4ecdc4;
                border-right-color: #ff6b6b;
            }
        }

        /* Tooltip System */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
            z-index: 1000;
            pointer-events: none;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.9);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .tooltip:hover::after,
        .tooltip:hover::before {
            opacity: 1;
            visibility: visible;
        }

        /* Audio Visualizer Enhancements */
        .visualizer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 70%),
                linear-gradient(45deg, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                linear-gradient(-45deg, rgba(78, 205, 196, 0.1) 0%, transparent 50%);
            mix-blend-mode: overlay;
        }

        /* Enhanced Mobile Responsiveness */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 12px;
                padding: 0 16px;
            }
            
            .title {
                font-size: 22px;
                margin-bottom: 12px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 13px;
                min-width: 140px;
            }

            select {
                min-width: 140px;
                padding: 12px 16px;
            }

            .header {
                padding: 16px;
            }

            .stats {
                bottom: 140px;
                left: 16px;
                right: 16px;
                font-size: 12px;
                padding: 16px;
            }

            .progress-container {
                bottom: 16px;
                left: 16px;
                right: 16px;
                width: auto;
                transform: none;
            }

            .fullscreen-btn {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 16px;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .btn {
                background: rgba(255, 255, 255, 0.3);
                border-color: rgba(255, 255, 255, 0.8);
            }

            .stats, .progress-container {
                background: rgba(0, 0, 0, 0.8);
                border-color: rgba(255, 255, 255, 0.5);
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            body::before {
                animation: none;
            }
        }

        /* Focus states for accessibility */
        .btn:focus,
        select:focus,
        .progress-bar:focus,
        .fullscreen-btn:focus {
            outline: 2px solid #4ecdc4;
            outline-offset: 2px;
        }

        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #ff5252, #26c6da);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🎵 Professional Music Visualizer</h1>
            <div class="controls">
                <div class="file-input-wrapper tooltip" data-tooltip="Load an audio file (MP3, WAV, etc.)">
                    <input type="file" id="audioFile" class="file-input" accept="audio/*">
                    <label for="audioFile" class="btn">📁 Load Audio</label>
                </div>
                
                <button id="playPause" class="btn tooltip" data-tooltip="Space to play/pause" disabled>▶️ Play</button>
                
                <div class="select-wrapper tooltip" data-tooltip="Choose visualization style">
                    <select id="visualizerMode">
                        <option value="spectrum">🎚️ Spectrum Analyzer</option>
                        <option value="particles">✨ Particle System</option>
                        <option value="waveform">〰️ Waveform</option>
                        <option value="circular">⭕ Circular Spectrum</option>
                        <option value="bars3d">📊 3D Bars</option>
                        <option value="galaxy">🌌 Galaxy Mode</option>
                    </select>
                </div>
                
                <div class="select-wrapper tooltip" data-tooltip="Select color theme">
                    <select id="colorTheme">
                        <option value="rainbow">🌈 Rainbow</option>
                        <option value="neon">💫 Neon</option>
                        <option value="fire">🔥 Fire</option>
                        <option value="ocean">🌊 Ocean</option>
                        <option value="aurora">🌌 Aurora</option>
                        <option value="monochrome">⚫ Monochrome</option>
                    </select>
                </div>
                
                <button id="toggleStats" class="btn tooltip" data-tooltip="Toggle performance stats">📊 Stats</button>
            </div>
        </div>

        <button class="fullscreen-btn tooltip" id="fullscreenBtn" data-tooltip="Toggle fullscreen (F key)">⛶</button>

        <div class="visualizer-overlay"></div>
        <canvas id="visualizer" class="visualizer-canvas"></canvas>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Processing audio...</div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div><strong>Performance Metrics</strong></div>
            <hr style="margin: 8px 0; border: 1px solid rgba(255,255,255,0.2);">
            <div>FPS: <span id="fps">0</span></div>
            <div>Frequency Bins: <span id="freqBins">0</span></div>
            <div>Sample Rate: <span id="sampleRate">0</span> Hz</div>
            <div>Duration: <span id="duration">0</span>s</div>
            <div>Peak Frequency: <span id="peakFreq">0</span> Hz</div>
            <div>Audio Quality: <span id="audioQuality">Unknown</span></div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
    </div>

    <script>
        class MusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.dataArray = null;
                this.audio = new Audio();
                this.isPlaying = false;
                this.animationId = null;
                this.mode = 'spectrum';
                this.colorTheme = 'rainbow';
                this.particles = [];
                this.frameCount = 0;
                this.fps = 0;
                this.lastTime = 0;
                
                this.setupCanvas();
                this.setupAudio();
                this.setupEventListeners();
                this.startVisualization();
                
                // Performance monitoring
                this.fpsCounter = 0;
                this.lastFPSUpdate = Date.now();
            }

            setupCanvas() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupAudio() {
                this.audio.crossOrigin = "anonymous";
                this.audio.addEventListener('loadedmetadata', () => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('progressContainer').style.display = 'block';
                    this.updateStats();
                });

                this.audio.addEventListener('timeupdate', () => {
                    this.updateProgress();
                });

                this.audio.addEventListener('ended', () => {
                    this.isPlaying = false;
                    document.getElementById('playPause').textContent = '▶️ Play';
                });
            }

            setupEventListeners() {
                // File input
                document.getElementById('audioFile').addEventListener('change', (e) => {
                    this.loadAudioFile(e.target.files[0]);
                });

                // Play/Pause
                document.getElementById('playPause').addEventListener('click', () => {
                    this.togglePlayPause();
                });

                // Mode selection
                document.getElementById('visualizerMode').addEventListener('change', (e) => {
                    this.mode = e.target.value;
                    if (this.mode === 'particles') {
                        this.initParticles();
                    }
                });

                // Color theme
                document.getElementById('colorTheme').addEventListener('change', (e) => {
                    this.colorTheme = e.target.value;
                });

                // Stats toggle
                document.getElementById('toggleStats').addEventListener('click', () => {
                    const stats = document.getElementById('stats');
                    stats.style.display = stats.style.display === 'none' ? 'block' : 'none';
                });

                // Progress bar
                document.getElementById('progressBar').addEventListener('click', (e) => {
                    const rect = e.target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const percentage = x / rect.width;
                    this.audio.currentTime = percentage * this.audio.duration;
                });

                // Fullscreen
                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    switch(e.code) {
                        case 'Space':
                            e.preventDefault();
                            this.togglePlayPause();
                            break;
                        case 'KeyF':
                            this.toggleFullscreen();
                            break;
                    }
                });
            }

            async loadAudioFile(file) {
                if (!file) return;

                document.getElementById('loading').classList.remove('hidden');
                
                try {
                    const url = URL.createObjectURL(file);
                    this.audio.src = url;
                    
                    // Initialize Web Audio API
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        this.analyser = this.audioContext.createAnalyser();
                        this.analyser.fftSize = 2048;
                        this.analyser.smoothingTimeConstant = 0.85;
                        
                        this.source = this.audioContext.createMediaElementSource(this.audio);
                        this.source.connect(this.analyser);
                        this.analyser.connect(this.audioContext.destination);
                        
                        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    }
                    
                    document.getElementById('playPause').disabled = false;
                    this.initParticles();
                    
                } catch (error) {
                    console.error('Error loading audio file:', error);
                    alert('Error loading audio file. Please try a different file.');
                    document.getElementById('loading').classList.add('hidden');
                }
            }

            togglePlayPause() {
                if (!this.audio.src) return;

                if (this.isPlaying) {
                    this.audio.pause();
                    document.getElementById('playPause').textContent = '▶️ Play';
                } else {
                    this.audio.play();
                    document.getElementById('playPause').textContent = '⏸️ Pause';
                    if (this.audioContext.state === 'suspended') {
                        this.audioContext.resume();
                    }
                }
                this.isPlaying = !this.isPlaying;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        life: Math.random(),
                        maxLife: Math.random() * 100 + 50
                    });
                }
            }

            getColor(index, total, intensity = 1) {
                const themes = {
                    rainbow: (i, t) => `hsl(${(i / t) * 360}, 100%, ${50 + intensity * 30}%)`,
                    neon: (i, t) => {
                        const colors = ['#ff0080', '#0080ff', '#80ff00', '#ff8000'];
                        return colors[Math.floor((i / t) * colors.length)];
                    },
                    fire: (i, t) => `hsl(${(i / t) * 60}, 100%, ${50 + intensity * 30}%)`,
                    ocean: (i, t) => `hsl(${180 + (i / t) * 60}, 100%, ${40 + intensity * 40}%)`,
                    aurora: (i, t) => {
                        const hue = (i / t) * 120 + 180;
                        return `hsl(${hue}, 80%, ${60 + intensity * 20}%)`;
                    },
                    monochrome: (i, t) => `rgba(255, 255, 255, ${0.3 + intensity * 0.7})`
                };
                
                return themes[this.colorTheme](index, total);
            }

            drawSpectrum() {
                this.analyser.getByteFrequencyData(this.dataArray);
                
                const barWidth = this.canvas.width / this.dataArray.length * 2.5;
                let x = 0;

                for (let i = 0; i < this.dataArray.length; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.7;
                    const intensity = this.dataArray[i] / 255;
                    
                    this.ctx.fillStyle = this.getColor(i, this.dataArray.length, intensity);
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth + 1;
                }
            }

            drawParticles() {
                this.analyser.getByteFreequencyData(this.dataArray);
                const avgFrequency = this.dataArray.reduce((a, b) => a + b) / this.dataArray.length;
                
                // Update particles
                this.particles.forEach((particle, index) => {
                    const audioInfluence = (avgFrequency / 255) * 5;
                    
                    particle.x += particle.vx + audioInfluence;
                    particle.y += particle.vy;
                    particle.life--;
                    
                    // Wrap around screen
                    if (particle.x > this.canvas.width) particle.x = 0;
                    if (particle.x < 0) particle.x = this.canvas.width;
                    if (particle.y > this.canvas.height) particle.y = 0;
                    if (particle.y < 0) particle.y = this.canvas.height;
                    
                    // Reset particle if life is over
                    if (particle.life <= 0) {
                        particle.x = Math.random() * this.canvas.width;
                        particle.y = Math.random() * this.canvas.height;
                        particle.life = particle.maxLife;
                    }
                    
                    // Draw particle
                    const intensity = (avgFrequency / 255);
                    const size = particle.size + intensity * 3;
                    
                    this.ctx.save();
                    this.ctx.globalAlpha = (particle.life / particle.maxLife) * intensity;
                    this.ctx.fillStyle = this.getColor(index, this.particles.length, intensity);
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }

            drawWaveform() {
                const bufferLength = this.analyser.fftSize;
                const dataArray = new Uint8Array(bufferLength);
                this.analyser.getByteTimeDomainData(dataArray);
                
                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = this.getColor(0, 1, 1);
                this.ctx.beginPath();
                
                const sliceWidth = this.canvas.width / bufferLength;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * this.canvas.height / 2;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
            }

            drawCircularSpectrum() {
                this.analyser.getByteFrequencyData(this.dataArray);
                
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.4;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const angle = (i / this.dataArray.length) * Math.PI * 2;
                    const barHeight = (this.dataArray[i] / 255) * radius;
                    const intensity = this.dataArray[i] / 255;
                    
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                    const y2 = centerY + Math.sin(angle) * (radius + barHeight);
                    
                    this.ctx.strokeStyle = this.getColor(i, this.dataArray.length, intensity);
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x2, y2);
                    this.ctx.stroke();
                }
            }

            draw3DBars() {
                this.analyser.getByteFrequencyData(this.dataArray);
                
                const barWidth = this.canvas.width / this.dataArray.length * 3;
                let x = 0;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.8;
                    const intensity = this.dataArray[i] / 255;
                    
                    // Create 3D effect with gradients
                    const gradient = this.ctx.createLinearGradient(x, this.canvas.height - barHeight, x + barWidth, this.canvas.height);
                    gradient.addColorStop(0, this.getColor(i, this.dataArray.length, intensity));
                    gradient.addColorStop(1, this.getColor(i, this.dataArray.length, intensity * 0.3));
                    
                    // Main bar
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    
                    // 3D shadow effect
                    this.ctx.fillStyle = `rgba(0, 0, 0, ${intensity * 0.3})`;
                    this.ctx.fillRect(x + 3, this.canvas.height - barHeight + 3, barWidth, barHeight);
                    
                    x += barWidth + 2;
                }
            }

            drawGalaxy() {
                this.analyser.getByteFrequencyData(this.dataArray);
                
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const time = this.frameCount * 0.01;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const intensity = this.dataArray[i] / 255;
                    const radius = (i / this.dataArray.length) * Math.min(centerX, centerY) * 0.8;
                    const angle = time + (i / this.dataArray.length) * Math.PI * 4;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    const size = intensity * 8 + 2;
                    
                    this.ctx.save();
                    this.ctx.globalAlpha = intensity;
                    this.ctx.fillStyle = this.getColor(i, this.dataArray.length, intensity);
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowColor = this.getColor(i, this.dataArray.length, intensity);
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
            }

            updateStats() {
                document.getElementById('freqBins').textContent = this.analyser ? this.analyser.frequencyBinCount : 0;
                document.getElementById('sampleRate').textContent = this.audioContext ? this.audioContext.sampleRate : 0;
                document.getElementById('duration').textContent = this.audio.duration ? this.audio.duration.toFixed(1) : 0;
                
                // Determine audio quality
                if (this.audioContext && this.audio.duration) {
                    const sampleRate = this.audioContext.sampleRate;
                    let quality = 'Standard';
                    if (sampleRate >= 48000) quality = 'High';
                    if (sampleRate >= 96000) quality = 'Studio';
                    document.getElementById('audioQuality').textContent = quality;
                }
                
                // Calculate peak frequency
                if (this.dataArray) {
                    let maxIndex = 0;
                    let maxValue = 0;
                    for (let i = 0; i < this.dataArray.length; i++) {
                        if (this.dataArray[i] > maxValue) {
                            maxValue = this.dataArray[i];
                            maxIndex = i;
                        }
                    }
                    const peakFreq = (maxIndex / this.dataArray.length) * (this.audioContext.sampleRate / 2);
                    document.getElementById('peakFreq').textContent = peakFreq.toFixed(0);
                }
            }

            updateProgress() {
                const progress = (this.audio.currentTime / this.audio.duration) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
                
                document.getElementById('currentTime').textContent = this.formatTime(this.audio.currentTime);
                document.getElementById('totalTime').textContent = this.formatTime(this.audio.duration);
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            updateFPS(currentTime) {
                this.fpsCounter++;
                if (currentTime - this.lastFPSUpdate >= 1000) {
                    this.fps = this.fpsCounter;
                    document.getElementById('fps').textContent = this.fps;
                    this.fpsCounter = 0;
                    this.lastFPSUpdate = currentTime;
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            draw() {
                const currentTime = performance.now();
                this.updateFPS(currentTime);
                
                // Clear canvas with fade effect for trails
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.analyser && this.isPlaying) {
                    switch (this.mode) {
                        case 'spectrum':
                            this.drawSpectrum();
                            break;
                        case 'particles':
                            this.drawParticles();
                            break;
                        case 'waveform':
                            this.drawWaveform();
                            break;
                        case 'circular':
                            this.drawCircularSpectrum();
                            break;
                        case 'bars3d':
                            this.draw3DBars();
                            break;
                        case 'galaxy':
                            this.drawGalaxy();
                            break;
                    }
                    
                    this.updateStats();
                }
                
                this.frameCount++;
            }

            startVisualization() {
                const animate = () => {
                    this.draw();
                    this.animationId = requestAnimationFrame(animate);
                };
                animate();
            }
        }

        // Initialize the visualizer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MusicVisualizer();
        });
    </script>
</body>
