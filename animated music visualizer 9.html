<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e, #0f1419);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .header:hover {
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #ff9ff3);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            animation: logoGlow 3s ease-in-out infinite alternate;
            letter-spacing: 2px;
            position: relative;
        }

        @keyframes logoGlow {
            0% { 
                text-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
                background-position: 0% 50%;
            }
            50% { 
                text-shadow: 0 0 40px rgba(78, 205, 196, 0.6);
                background-position: 50% 50%;
            }
            100% { 
                text-shadow: 0 0 30px rgba(69, 183, 209, 0.4);
                background-position: 100% 50%;
            }
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -10px;
            right: -10px;
            bottom: -5px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #ff9ff3);
            border-radius: 10px;
            filter: blur(15px);
            opacity: 0.3;
            z-index: -1;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 0.4; transform: scale(1.1); }
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .control-group:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .file-input-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .file-input-label:hover::before {
            left: 100%;
        }

        .file-input-label:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.5);
            background: linear-gradient(45deg, #ff8a8a, #6ee5dc);
        }

        .control-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 80px;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            transition: all 0.6s ease;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .control-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .control-btn.active {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
            border-color: rgba(78, 205, 196, 0.6);
            transform: translateY(-1px);
        }

        .control-btn.active:hover {
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.6);
        }

        select {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            backdrop-filter: blur(15px);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            text-transform: capitalize;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        select:focus {
            outline: none;
            border-color: rgba(78, 205, 196, 0.5);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        #canvas {
            flex: 1;
            display: block;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.05), transparent);
        }

        .info-panel {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .info-panel:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .track-info {
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .track-info:first-child {
            font-weight: 600;
            font-size: 16px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .frequency-display {
            display: flex;
            gap: 15px;
            font-size: 13px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .freq-band {
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            min-width: 60px;
        }

        .freq-band:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .freq-band div:first-child {
            font-weight: 600;
            opacity: 0.8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .freq-band div:last-child {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 107, 107, 0.2);
            border-radius: 50%;
            animation: pulse 3s infinite ease-out;
            pointer-events: none;
        }

        .pulse-ring::before,
        .pulse-ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(78, 205, 196, 0.3);
            animation: pulse 4s infinite ease-out;
        }

        .pulse-ring::before {
            width: 200px;
            height: 200px;
            animation-delay: -1s;
        }

        .pulse-ring::after {
            width: 400px;
            height: 400px;
            animation-delay: -2s;
            border-color: rgba(69, 183, 209, 0.2);
        }

        @keyframes pulse {
            0% { 
                transform: translate(-50%, -50%) scale(0.8); 
                opacity: 1; 
            }
            70% { 
                transform: translate(-50%, -50%) scale(1.4); 
                opacity: 0.3; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(2); 
                opacity: 0; 
            }
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: 600;
            opacity: 0.8;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: loadingPulse 2s ease-in-out infinite;
            letter-spacing: 1px;
        }

        @keyframes loadingPulse {
            0%, 100% { 
                opacity: 0.6; 
                transform: translate(-50%, -50%) scale(1);
                background-position: 0% 50%;
            }
            50% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1.05);
                background-position: 100% 50%;
            }
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { 
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.3; }
            90% { opacity: 0.1; }
            100% { 
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .status-indicator {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .status-indicator.playing {
            background: #4ecdc4;
            animation: statusPulse 1.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .info-panel {
                left: 10px;
                right: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">AudioViz Pro</div>
            <div class="controls">
                <div class="control-group">
                    <div class="file-input-wrapper">
                        <input type="file" id="audioFile" accept="audio/*">
                        <label for="audioFile" class="file-input-label">Choose Audio</label>
                    </div>
                </div>
                
                <div class="control-group">
                    <button id="playBtn" class="control-btn">Play</button>
                    <button id="pauseBtn" class="control-btn">Pause</button>
                </div>
                
                <div class="control-group">
                    <select id="visualizerMode">
                        <option value="bars">Frequency Bars</option>
                        <option value="particles">Particle System</option>
                        <option value="waves">Waveform</option>
                        <option value="spiral">Spiral</option>
                        <option value="matrix">Matrix</option>
                    </select>
                    <select id="colorTheme">
                        <option value="neon">Neon</option>
                        <option value="fire">Fire</option>
                        <option value="ocean">Ocean</option>
                        <option value="aurora">Aurora</option>
                        <option value="synthwave">Synthwave</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <button id="fullscreenBtn" class="control-btn">Fullscreen</button>
                </div>
            </div>
        </div>
        
        <canvas id="canvas"></canvas>
        
        <div class="floating-elements"></div>
        <div class="status-indicator" id="statusIndicator"></div>
        
        <div class="info-panel">
            <div class="track-info" id="trackName">No track loaded</div>
            <div class="track-info" id="currentTime">00:00 / 00:00</div>
            <div class="frequency-display">
                <div class="freq-band">
                    <div>Bass</div>
                    <div id="bassLevel">0</div>
                </div>
                <div class="freq-band">
                    <div>Mid</div>
                    <div id="midLevel">0</div>
                </div>
                <div class="freq-band">
                    <div>Treble</div>
                    <div id="trebleLevel">0</div>
                </div>
            </div>
        </div>
        
        <div class="pulse-ring"></div>
        <div class="loading" id="loading" style="display: none;">Loading audio...</div>
    </div>

    <audio id="audio" style="display: none;"></audio>

    <script>
        class ProfessionalMusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = document.getElementById('audio');
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.dataArray = null;
                this.particles = [];
                this.isPlaying = false;
                this.currentMode = 'bars';
                this.currentTheme = 'neon';
                this.time = 0;
                
                this.initializeCanvas();
                this.bindEvents();
                this.animate();
                this.createFloatingElements();
                
                // Generate demo particles for initial display
                this.generateDemoParticles();
            }
            
            initializeCanvas() {
                const resizeCanvas = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            
            bindEvents() {
                const fileInput = document.getElementById('audioFile');
                const playBtn = document.getElementById('playBtn');
                const pauseBtn = document.getElementById('pauseBtn');
                const modeSelect = document.getElementById('visualizerMode');
                const themeSelect = document.getElementById('colorTheme');
                const fullscreenBtn = document.getElementById('fullscreenBtn');
                
                fileInput.addEventListener('change', (e) => this.loadAudio(e.target.files[0]));
                playBtn.addEventListener('click', () => this.play());
                pauseBtn.addEventListener('click', () => this.pause());
                modeSelect.addEventListener('change', (e) => this.setMode(e.target.value));
                themeSelect.addEventListener('change', (e) => this.setTheme(e.target.value));
                fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());
                
                this.audio.addEventListener('timeupdate', () => this.updateTimeDisplay());
                this.audio.addEventListener('ended', () => this.onTrackEnd());
            }
            
            async loadAudio(file) {
                if (!file) return;
                
                document.getElementById('loading').style.display = 'block';
                
                try {
                    const url = URL.createObjectURL(file);
                    this.audio.src = url;
                    
                    document.getElementById('trackName').textContent = file.name;
                    
                    // Initialize Web Audio API
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        this.analyser = this.audioContext.createAnalyser();
                        this.analyser.fftSize = 512;
                        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                        
                        this.source = this.audioContext.createMediaElementSource(this.audio);
                        this.source.connect(this.analyser);
                        this.analyser.connect(this.audioContext.destination);
                    }
                    
                    document.getElementById('loading').style.display = 'none';
                } catch (error) {
                    console.error('Error loading audio:', error);
                    document.getElementById('loading').style.display = 'none';
                }
            }
            
            play() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }
                
                this.audio.play();
                this.isPlaying = true;
                document.getElementById('playBtn').classList.add('active');
                document.getElementById('pauseBtn').classList.remove('active');
                document.getElementById('statusIndicator').classList.add('playing');
            }
            
            pause() {
                this.audio.pause();
                this.isPlaying = false;
                document.getElementById('pauseBtn').classList.add('active');
                document.getElementById('playBtn').classList.remove('active');
                document.getElementById('statusIndicator').classList.remove('playing');
            }
                
            
            onTrackEnd() {
                this.isPlaying = false;
                document.getElementById('playBtn').classList.remove('active');
                document.getElementById('pauseBtn').classList.remove('active');
                document.getElementById('statusIndicator').classList.remove('playing');
            }
            
            createFloatingElements() {
                const container = document.querySelector('.floating-elements');
                for (let i = 0; i < 15; i++) {
                    const element = document.createElement('div');
                    element.className = 'floating-element';
                    element.style.left = Math.random() * 100 + '%';
                    element.style.animationDelay = Math.random() * 20 + 's';
                    element.style.animationDuration = (Math.random() * 10 + 15) + 's';
                    container.appendChild(element);
                }
            }
            
            setMode(mode) {
                this.currentMode = mode;
                this.particles = []; // Clear particles when changing mode
            }
            
            setTheme(theme) {
                this.currentTheme = theme;
            }
            
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
            
            updateTimeDisplay() {
                const current = this.formatTime(this.audio.currentTime);
                const duration = this.formatTime(this.audio.duration);
                document.getElementById('currentTime').textContent = `${current} / ${duration}`;
            }
            
            formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            onTrackEnd() {
                this.isPlaying = false;
                document.getElementById('playBtn').classList.remove('active');
                document.getElementById('pauseBtn').classList.remove('active');
                document.getElementById('statusIndicator').classList.remove('playing');
            }
            
            getColorPalette(theme, intensity = 1) {
                const palettes = {
                    neon: {
                        primary: `rgba(255, ${Math.floor(107 * intensity)}, ${Math.floor(107 * intensity)}, 0.8)`,
                        secondary: `rgba(${Math.floor(78 * intensity)}, 205, ${Math.floor(196 * intensity)}, 0.8)`,
                        accent: `rgba(${Math.floor(69 * intensity)}, ${Math.floor(183 * intensity)}, 209, 0.8)`
                    },
                    fire: {
                        primary: `rgba(255, ${Math.floor(69 * intensity)}, 0, 0.8)`,
                        secondary: `rgba(255, ${Math.floor(140 * intensity)}, 0, 0.8)`,
                        accent: `rgba(255, ${Math.floor(215 * intensity)}, 0, 0.8)`
                    },
                    ocean: {
                        primary: `rgba(0, ${Math.floor(119 * intensity)}, 190, 0.8)`,
                        secondary: `rgba(0, ${Math.floor(180 * intensity)}, 216, 0.8)`,
                        accent: `rgba(144, ${Math.floor(224 * intensity)}, 239, 0.8)`
                    },
                    aurora: {
                        primary: `rgba(${Math.floor(138 * intensity)}, 43, 226, 0.8)`,
                        secondary: `rgba(0, 255, ${Math.floor(127 * intensity)}, 0.8)`,
                        accent: `rgba(255, ${Math.floor(20 * intensity)}, 147, 0.8)`
                    },
                    synthwave: {
                        primary: `rgba(255, 0, ${Math.floor(255 * intensity)}, 0.8)`,
                        secondary: `rgba(0, 255, ${Math.floor(255 * intensity)}, 0.8)`,
                        accent: `rgba(255, ${Math.floor(255 * intensity)}, 0, 0.8)`
                    }
                };
                
                return palettes[theme] || palettes.neon;
            }
            
            generateDemoParticles() {
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        intensity: Math.random() * 0.5 + 0.5
                    });
                }
            }
            
            updateFrequencyDisplay() {
                if (!this.dataArray) return;
                
                const bassRange = this.dataArray.slice(0, 10);
                const midRange = this.dataArray.slice(10, 100);
                const trebleRange = this.dataArray.slice(100, 256);
                
                const bass = bassRange.reduce((a, b) => a + b, 0) / bassRange.length;
                const mid = midRange.reduce((a, b) => a + b, 0) / midRange.length;
                const treble = trebleRange.reduce((a, b) => a + b, 0) / trebleRange.length;
                
                document.getElementById('bassLevel').textContent = Math.floor(bass);
                document.getElementById('midLevel').textContent = Math.floor(mid);
                document.getElementById('trebleLevel').textContent = Math.floor(treble);
            }
            
            drawBars() {
                if (!this.dataArray) return;
                
                const barWidth = this.canvas.width / this.dataArray.length;
                const colors = this.getColorPalette(this.currentTheme);
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.8;
                    const x = i * barWidth;
                    const y = this.canvas.height - barHeight;
                    
                    const intensity = this.dataArray[i] / 255;
                    const gradient = this.ctx.createLinearGradient(0, y, 0, this.canvas.height);
                    
                    if (i < 85) {
                        gradient.addColorStop(0, colors.primary);
                        gradient.addColorStop(1, colors.primary.replace('0.8', '0.3'));
                    } else if (i < 170) {
                        gradient.addColorStop(0, colors.secondary);
                        gradient.addColorStop(1, colors.secondary.replace('0.8', '0.3'));
                    } else {
                        gradient.addColorStop(0, colors.accent);
                        gradient.addColorStop(1, colors.accent.replace('0.8', '0.3'));
                    }
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, y, barWidth - 1, barHeight);
                    
                    // Add glow effect
                    if (intensity > 0.7) {
                        this.ctx.shadowBlur = 20;
                        this.ctx.shadowColor = colors.primary;
                        this.ctx.fillRect(x, y, barWidth - 1, barHeight);
                        this.ctx.shadowBlur = 0;
                    }
                }
            }
            
            drawParticles() {
                const colors = this.getColorPalette(this.currentTheme);
                
                // Update particles based on audio data
                if (this.dataArray && this.isPlaying) {
                    const avgFreq = this.dataArray.reduce((a, b) => a + b, 0) / this.dataArray.length;
                    const bassImpact = this.dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
                    
                    // Add new particles on beat
                    if (bassImpact > 100 && this.particles.length < 200) {
                        for (let i = 0; i < 5; i++) {
                            this.particles.push({
                                x: this.canvas.width / 2,
                                y: this.canvas.height / 2,
                                vx: (Math.random() - 0.5) * 20,
                                vy: (Math.random() - 0.5) * 20,
                                size: Math.random() * 6 + 2,
                                intensity: bassImpact / 255,
                                life: 1.0
                            });
                        }
                    }
                }
                
                // Update and draw particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    
                    if (p.life !== undefined) {
                        p.life -= 0.02;
                        if (p.life <= 0) {
                            this.particles.splice(i, 1);
                            continue;
                        }
                    }
                    
                    // Wrap around edges
                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;
                    
                    // Draw particle
                    const alpha = p.life || p.intensity || 0.5;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, colors.primary.replace('0.8', alpha.toString()));
                    gradient.addColorStop(1, colors.secondary.replace('0.8', '0'));
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                }
            }
            
            drawWaveform() {
                if (!this.dataArray) return;
                
                const colors = this.getColorPalette(this.currentTheme);
                const centerY = this.canvas.height / 2;
                const amplitude = 200;
                
                this.ctx.beginPath();
                this.ctx.strokeStyle = colors.primary;
                this.ctx.lineWidth = 3;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const x = (i / this.dataArray.length) * this.canvas.width;
                    const y = centerY + (this.dataArray[i] - 128) * (amplitude / 128);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // Add secondary waveform
                this.ctx.beginPath();
                this.ctx.strokeStyle = colors.secondary;
                this.ctx.lineWidth = 2;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const x = (i / this.dataArray.length) * this.canvas.width;
                    const y = centerY + (this.dataArray[i] - 128) * (amplitude / 256);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
            }
            
            drawSpiral() {
                if (!this.dataArray) return;
                
                const colors = this.getColorPalette(this.currentTheme);
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.ctx.beginPath();
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const angle = (i / this.dataArray.length) * Math.PI * 8 + this.time * 0.01;
                    const radius = (this.dataArray[i] / 255) * 200 + 50;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    const intensity = this.dataArray[i] / 255;
                    const size = intensity * 5 + 1;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    
                    const color = i < 85 ? colors.primary : i < 170 ? colors.secondary : colors.accent;
                    this.ctx.fillStyle = color.replace('0.8', intensity.toString());
                    this.ctx.fill();
                }
            }
            
            drawMatrix() {
                if (!this.dataArray) return;
                
                const colors = this.getColorPalette(this.currentTheme);
                const cols = 32;
                const rows = 24;
                const cellWidth = this.canvas.width / cols;
                const cellHeight = this.canvas.height / rows;
                
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const dataIndex = Math.floor((x * rows + y) % this.dataArray.length);
                        const intensity = this.dataArray[dataIndex] / 255;
                        
                        if (intensity > 0.3) {
                            this.ctx.fillStyle = colors.primary.replace('0.8', intensity.toString());
                            this.ctx.fillRect(x * cellWidth, y * cellHeight, cellWidth - 1, cellHeight - 1);
                            
                            if (intensity > 0.8) {
                                this.ctx.shadowBlur = 10;
                                this.ctx.shadowColor = colors.accent;
                                this.ctx.fillRect(x * cellWidth, y * cellHeight, cellWidth - 1, cellHeight - 1);
                                this.ctx.shadowBlur = 0;
                            }
                        }
                    }
                }
            }
            
            animate() {
                this.time++;
                
                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(12, 12, 12, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Get audio data
                if (this.analyser && this.isPlaying) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.updateFrequencyDisplay();
                }
                
                // Render based on current mode
                switch (this.currentMode) {
                    case 'bars':
                        this.drawBars();
                        break;
                    case 'particles':
                        this.drawParticles();
                        break;
                    case 'waves':
                        this.drawWaveform();
                        break;
                    case 'spiral':
                        this.drawSpiral();
                        break;
                    case 'matrix':
                        this.drawMatrix();
                        break;
                }
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize the visualizer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ProfessionalMusicVisualizer();
        });
    </script>
