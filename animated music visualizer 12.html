<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #visualizer-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            overflow: hidden;
        }

        /* Enhanced glass morphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }

        /* Enhanced controls with better hierarchy */
        #controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px;
            border-radius: 20px;
            min-width: 280px;
            max-width: 320px;
            animation: slideInLeft 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* File input styling */
        #file-input {
            display: none;
        }

        .file-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            font-size: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .file-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .file-label:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .file-label:hover::before {
            left: 100%;
        }

        .file-label:active {
            transform: translateY(-1px) scale(0.98);
            transition: all 0.1s;
        }

        /* Enhanced control groups */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 0;
        }

        .control-group label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        /* Enhanced select styling */
        select {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            padding: 14px 16px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* Custom range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            padding: 0;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                0 2px 8px rgba(102, 126, 234, 0.4),
                0 0 0 2px rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 
                0 4px 15px rgba(102, 126, 234, 0.6),
                0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 
                0 2px 8px rgba(102, 126, 234, 0.4),
                0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        /* Enhanced play controls */
        .play-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .play-btn {
            background: linear-gradient(135deg, #36d1dc 0%, #5b86e5 100%);
            border: none;
            color: white;
            padding: 14px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            flex: 1;
            box-shadow: 0 4px 15px rgba(54, 209, 220, 0.3);
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .play-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(54, 209, 220, 0.5);
        }

        .play-btn:hover::before {
            left: 100%;
        }

        .play-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .play-btn:disabled::before {
            display: none;
        }

        /* Enhanced info panel */
        #info-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            min-width: 260px;
            max-width: 300px;
            z-index: 1000;
            padding: 24px;
            border-radius: 20px;
            animation: slideInRight 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .song-info {
            margin-bottom: 20px;
        }

        .song-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        .song-duration {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Enhanced progress bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
            margin: 16px 0;
            cursor: pointer;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #36d1dc, #5b86e5, #667eea);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 3px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .fps-counter {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 16px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Enhanced theme preview */
        #theme-preview {
            position: absolute;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 16px;
            z-index: 1000;
            animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .theme-dot::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .theme-dot:hover {
            transform: translateY(-4px) scale(1.15);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(255, 255, 255, 0.1);
        }

        .theme-dot:hover::before {
            opacity: 1;
        }

        .theme-dot.active {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.4),
                0 4px 20px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), 0 4px 20px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.6), 0 4px 20px rgba(0, 0, 0, 0.3); }
        }

        /* Enhanced loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            padding: 32px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading p {
            font-size: 16px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        /* Accessibility improvements */
        .hidden {
            display: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus states for accessibility */
        button:focus,
        input:focus,
        select:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        /* Tooltip system */
        .tooltip {
            position: relative;
        }

        .tooltip::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .tooltip:hover::before,
        .tooltip:hover::after {
            opacity: 1;
        }

        /* Performance indicator */
        .performance-indicator {
            position: absolute;
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            width: 4px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .performance-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #22c55e, #eab308, #ef4444);
            transition: height 0.3s ease;
            border-radius: 2px;
        }

        /* Keyboard shortcuts hint */
        .shortcuts-hint {
            position: absolute;
            bottom: 24px;
            right: 24px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 0.8;
                transform: translateY(0);
            }
        }

        .shortcuts-hint:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            #controls {
                top: 10px;
                left: 10px;
                right: 10px;
                padding: 15px;
            }

            #info-panel {
                top: 10px;
                right: 10px;
                left: auto;
                min-width: 150px;
            }

            #theme-preview {
                bottom: 10px;
                left: 10px;
            }
        }
        /* Enhanced responsive design */
@media (max-width: 1200px) {
    #controls {
        max-width: 280px;
    }
    
    #info-panel {
        max-width: 240px;
    }
}

@media (max-width: 768px) {
    #controls {
        top: 16px;
        left: 16px;
        right: 16px;
        max-width: none;
        min-width: auto;
        padding: 20px;
        border-radius: 16px;
    }

    #info-panel {
        top: 16px;
        right: 16px;
        min-width: auto;
        max-width: 200px;
        padding: 16px;
    }

    #theme-preview {
        bottom: 16px;
        left: 16px;
        gap: 12px;
        flex-wrap: wrap; /* allow wrap on smaller screens */
    }

    .theme-dot {
        width: 32px;
        height: 32px;
    }

    .shortcuts-hint {
        display: none;
    }

    .control-group label {
        font-size: 12px;
    }

    .file-label {
        padding: 14px 20px;
        font-size: 14px;
    }

    /* Completed: mobile-friendly play control */
    .play {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;           /* icon/text size */
        padding: 0;
        touch-action: manipulation; /* improves tap response */
    }

    /* If you have a row of controls, let them wrap neatly */
    .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    /* Sliders are easier to use with a larger thumb on mobile */
    input[type="range"] {
        height: 28px;
    }
    input[type="range"]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
    }
    input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
    }
}

/* Extra small screens */
@media (max-width: 480px) {
    #controls {
        left: 12px;
        right: 12px;
        padding: 16px;
        border-radius: 14px;
    }

    #info-panel {
        position: fixed;  /* keep it accessible */
        top: auto;
        bottom: 12px;
        right: 12px;
        max-width: 180px;
        padding: 12px;
        border-radius: 12px;
    }

    #theme-preview {
        left: 12px;
        right: 12px;
        gap: 10px;
    }

    .theme-dot {
        width: 28px;
        height: 28px;
    }

    .file-label {
        padding: 12px 16px;
        font-size: 13px;
    }

    .play {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        font-size: 15px;
    }
}

    </style>
</head>
<body>
    <div id="visualizer-container">
        <canvas id="visualizer"></canvas>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Processing audio...</p>
        </div>

        <div id="controls">
            <input type="file" id="file-input" accept="audio/*">
            <label for="file-input" class="file-label">Choose Audio File</label>
            
            <div class="control-group">
                <label>Visualization Mode</label>
                <select id="mode-select">
                    <option value="bars">Frequency Bars</option>
                    <option value="circular">Circular Spectrum</option>
                    <option value="particles">Particle Field</option>
                    <option value="waveform">Waveform</option>
                    <option value="spiral">Spiral Galaxy</option>
                    <option value="dna">DNA Helix</option>
                </select>
            </div>

            <div class="control-group">
                <label>Sensitivity</label>
                <input type="range" id="sensitivity" min="0.1" max="3" step="0.1" value="1">
            </div>

            <div class="control-group">
                <label>Smoothing</label>
                <input type="range" id="smoothing" min="0" max="0.9" step="0.1" value="0.8">
            </div>

            <div class="control-group">
                <label>Volume</label>
                <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
            </div>

            <div class="play-controls">
                <button class="play-btn" id="play-btn" disabled>Play</button>
                <button class="play-btn" id="pause-btn" disabled>Pause</button>
            </div>
        </div>

        <div id="info-panel">
            <div class="song-info">
                <div class="song-title">No audio loaded</div>
                <div class="song-duration">--:-- / --:--</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="fps-counter" id="fps-counter">FPS: --</div>
        </div>

        <div id="theme-preview">
            <div class="theme-dot active" data-theme="0" style="background: linear-gradient(45deg, #667eea, #764ba2);"></div>
            <div class="theme-dot" data-theme="1" style="background: linear-gradient(45deg, #f093fb, #f5576c);"></div>
            <div class="theme-dot" data-theme="2" style="background: linear-gradient(45deg, #4facfe, #00f2fe);"></div>
            <div class="theme-dot" data-theme="3" style="background: linear-gradient(45deg, #43e97b, #38f9d7);"></div>
            <div class="theme-dot" data-theme="4" style="background: linear-gradient(45deg, #fa709a, #fee140);"></div>
            <div class="theme-dot" data-theme="5" style="background: linear-gradient(45deg, #a8edea, #fed6e3);"></div>
        </div>
    </div>

    <script>
        class MusicVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new Audio();
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.dataArray = null;
                this.bufferLength = 0;
                this.isPlaying = false;
                this.animationId = null;
                
                // Visualization settings
                this.mode = 'bars';
                this.sensitivity = 1;
                this.smoothing = 0.8;
                this.currentTheme = 0;
                this.particles = [];
                this.rotation = 0;
                
                // Performance tracking
                this.fps = 0;
                this.lastTime = 0;
                this.frameCount = 0;
                
                // Color themes
                this.themes = [
                    { primary: [102, 126, 234], secondary: [118, 75, 162], accent: [54, 209, 220] },
                    { primary: [240, 147, 251], secondary: [245, 87, 108], accent: [255, 154, 0] },
                    { primary: [79, 172, 254], secondary: [0, 242, 254], accent: [124, 58, 237] },
                    { primary: [67, 233, 123], secondary: [56, 249, 215], accent: [34, 197, 94] },
                    { primary: [250, 112, 154], secondary: [254, 225, 64], accent: [251, 146, 60] },
                    { primary: [168, 237, 234], secondary: [254, 214, 227], accent: [196, 181, 253] }
                ];
                
                this.initializeCanvas();
                this.setupEventListeners();
                this.initializeParticles();
                this.animate();
            }

            initializeCanvas() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupEventListeners() {
                const fileInput = document.getElementById('file-input');
                const modeSelect = document.getElementById('mode-select');
                const sensitivityRange = document.getElementById('sensitivity');
                const smoothingRange = document.getElementById('smoothing');
                const volumeRange = document.getElementById('volume');
                const playBtn = document.getElementById('play-btn');
                const pauseBtn = document.getElementById('pause-btn');
                const themeDots = document.querySelectorAll('.theme-dot');

                fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                modeSelect.addEventListener('change', (e) => this.mode = e.target.value);
                sensitivityRange.addEventListener('input', (e) => this.sensitivity = parseFloat(e.target.value));
                smoothingRange.addEventListener('input', (e) => {
                    this.smoothing = parseFloat(e.target.value);
                    if (this.analyser) this.analyser.smoothingTimeConstant = this.smoothing;
                });
                volumeRange.addEventListener('input', (e) => this.audio.volume = parseFloat(e.target.value));
                
                playBtn.addEventListener('click', () => this.play());
                pauseBtn.addEventListener('click', () => this.pause());

                themeDots.forEach((dot, index) => {
                    dot.addEventListener('click', () => this.setTheme(index));
                });

                this.audio.addEventListener('ended', () => this.handleAudioEnd());
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
            }

            async handleFileSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                document.getElementById('loading').classList.remove('hidden');
                
                try {
                    const audioUrl = URL.createObjectURL(file);
                    this.audio.src = audioUrl;
                    
                    await this.initializeAudioContext();
                    
                    // Update UI
                    document.querySelector('.song-title').textContent = file.name.replace(/\.[^/.]+$/, "");
                    document.getElementById('play-btn').disabled = false;
                    document.getElementById('pause-btn').disabled = false;
                    
                    this.audio.addEventListener('loadedmetadata', () => {
                        this.updateDurationDisplay();
                        document.getElementById('loading').classList.add('hidden');
                    });
                    
                } catch (error) {
                    console.error('Error loading audio:', error);
                    document.getElementById('loading').classList.add('hidden');
                }
            }

            async initializeAudioContext() {
                if (this.audioContext) {
                    this.audioContext.close();
                }

                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.source = this.audioContext.createMediaElementSource(this.audio);
                
                this.source.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);
                
                this.analyser.fftSize = 2048;
                this.analyser.smoothingTimeConstant = this.smoothing;
                this.bufferLength = this.analyser.frequencyBinCount;
                this.dataArray = new Uint8Array(this.bufferLength);
            }

            initializeParticles() {
                this.particles = [];
                for (let i = 0; i < 200; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 3 + 1,
                        speedX: (Math.random() - 0.5) * 2,
                        speedY: (Math.random() - 0.5) * 2,
                        opacity: Math.random() * 0.5 + 0.3,
                        frequency: Math.floor(Math.random() * this.bufferLength)
                    });
                }
            }

            play() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }
                this.audio.play();
                this.isPlaying = true;
            }

            pause() {
                this.audio.pause();
                this.isPlaying = false;
            }

            handleAudioEnd() {
                this.isPlaying = false;
                this.audio.currentTime = 0;
            }

            updateProgress() {
                if (this.audio.duration) {
                    const progress = (this.audio.currentTime / this.audio.duration) * 100;
                    document.getElementById('progress-fill').style.width = progress + '%';
                    
                    const current = this.formatTime(this.audio.currentTime);
                    const total = this.formatTime(this.audio.duration);
                    document.querySelector('.song-duration').textContent = `${current} / ${total}`;
                }
            }

            updateDurationDisplay() {
                const total = this.formatTime(this.audio.duration);
                document.querySelector('.song-duration').textContent = `00:00 / ${total}`;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            setTheme(themeIndex) {
                this.currentTheme = themeIndex;
                document.querySelectorAll('.theme-dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === themeIndex);
                });
            }

            getThemeColor(type, alpha = 1) {
                const theme = this.themes[this.currentTheme];
                const color = theme[type] || theme.primary;
                return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
            }

            createGradient(x1, y1, x2, y2) {
                const gradient = this.ctx.createLinearGradient(x1, y1, x2, y2);
                gradient.addColorStop(0, this.getThemeColor('primary'));
                gradient.addColorStop(0.5, this.getThemeColor('secondary'));
                gradient.addColorStop(1, this.getThemeColor('accent'));
                return gradient;
            }

            animate(currentTime = 0) {
                this.animationId = requestAnimationFrame((time) => this.animate(time));
                
                // Calculate FPS
                if (currentTime - this.lastTime >= 1000) {
                    this.fps = Math.round(this.frameCount * 1000 / (currentTime - this.lastTime));
                    document.getElementById('fps-counter').textContent = `FPS: ${this.fps}`;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }
                this.frameCount++;
                
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.analyser && this.isPlaying) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.renderVisualization();
                } else {
                    this.renderIdle();
                }
                
                this.rotation += 0.01;
            }

            renderVisualization() {
                switch (this.mode) {
                    case 'bars':
                        this.renderBars();
                        break;
                    case 'circular':
                        this.renderCircular();
                        break;
                    case 'particles':
                        this.renderParticles();
                        break;
                    case 'waveform':
                        this.renderWaveform();
                        break;
                    case 'spiral':
                        this.renderSpiral();
                        break;
                    case 'dna':
                        this.renderDNA();
                        break;
                }
            }

            renderBars() {
                const barWidth = this.canvas.width / this.bufferLength * 2.5;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * this.canvas.height * this.sensitivity;
                    
                    const gradient = this.ctx.createLinearGradient(0, this.canvas.height, 0, this.canvas.height - barHeight);
                    gradient.addColorStop(0, this.getThemeColor('primary', 0.8));
                    gradient.addColorStop(0.5, this.getThemeColor('secondary', 0.6));
                    gradient.addColorStop(1, this.getThemeColor('accent', 0.9));
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    
                    // Add glow effect
                    this.ctx.shadowColor = this.getThemeColor('primary', 0.5);
                    this.ctx.shadowBlur = 10;
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    this.ctx.shadowBlur = 0;
                    
                    x += barWidth + 1;
                }
            }

            renderCircular() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.5;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * radius * this.sensitivity;
                    
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                    const y2 = centerY + Math.sin(angle) * (radius + amplitude);
                    
                    this.ctx.strokeStyle = this.getThemeColor('primary', 0.8);
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x2, y2);
                    this.ctx.stroke();
                }
                
                // Draw center circle
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                this.ctx.strokeStyle = this.getThemeColor('accent', 0.3);
                this.ctx.lineWidth = 1;
                this.ctx.stroke();
            }

            renderParticles() {
                this.particles.forEach(particle => {
                    const frequencyData = this.dataArray[particle.frequency] || 0;
                    const intensity = (frequencyData / 255) * this.sensitivity;
                    
                    // Update particle based on audio
                    particle.size = 1 + intensity * 5;
                    particle.opacity = 0.3 + intensity * 0.7;
                    
                    // Move particle
                    particle.x += particle.speedX + intensity * 2;
                    particle.y += particle.speedY + intensity * 2;
                    
                    // Wrap around screen
                    if (particle.x > this.canvas.width) particle.x = 0;
                    if (particle.x < 0) particle.x = this.canvas.width;
                    if (particle.y > this.canvas.height) particle.y = 0;
                    if (particle.y < 0) particle.y = this.canvas.height;
                    
                    // Draw particle
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = this.getThemeColor('primary', particle.opacity);
                    this.ctx.fill();
                    
                    // Add glow
                    this.ctx.shadowColor = this.getThemeColor('accent', 0.5);
                    this.ctx.shadowBlur = particle.size * 2;
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                });
            }

            renderWaveform() {
                this.ctx.strokeStyle = this.getThemeColor('primary', 0.8);
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                
                const sliceWidth = this.canvas.width / this.bufferLength;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const v = (this.dataArray[i] / 255) * this.sensitivity;
                    const y = (v * this.canvas.height) / 2 + this.canvas.height / 2;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
                
                // Add second waveform with phase shift
                this.ctx.strokeStyle = this.getThemeColor('secondary', 0.6);
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                
                x = 0;
                for (let i = 0; i < this.bufferLength; i++) {
                    const v = (this.dataArray[i] / 255) * this.sensitivity * 0.7;
                    const y = (-v * this.canvas.height) / 2 + this.canvas.height / 2;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
            }

            renderSpiral() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.ctx.strokeStyle = this.getThemeColor('primary', 0.8);
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 8 + this.rotation;
                    const radius = (i / this.bufferLength) * Math.min(centerX, centerY);
                    const amplitude = (this.dataArray[i] / 255) * 50 * this.sensitivity;
                    
                    const x = centerX + Math.cos(angle) * (radius + amplitude);
                    const y = centerY + Math.sin(angle) * (radius + amplitude);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
            }

            renderDNA() {
                const centerX = this.canvas.width / 2;
                const amplitude = 100;
                const frequency = 0.01;
                
                for (let i = 0; i < this.bufferLength / 4; i++) {
                    const audioAmplitude = (this.dataArray[i] / 255) * this.sensitivity * 50;
                    const y = (i / (this.bufferLength / 4)) * this.canvas.height;
                    
                    const x1 = centerX + Math.sin(y * frequency + this.rotation) * (amplitude + audioAmplitude);
                    const x2 = centerX - Math.sin(y * frequency + this.rotation) * (amplitude + audioAmplitude);
                    
                    // Draw DNA strands
                    this.ctx.strokeStyle = this.getThemeColor('primary', 0.8);
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(x1, y, 3, 0, Math.PI * 2);
                    this.ctx.stroke();
                    
                    this.ctx.strokeStyle = this.getThemeColor('secondary', 0.8);
                    this.ctx.beginPath();
                    this.ctx.arc(x2, y, 3, 0, Math.PI * 2);
                    this.ctx.stroke();
                    
                    // Draw connecting lines
                    if (i % 8 === 0) {
                        this.ctx.strokeStyle = this.getThemeColor('accent', 0.4);
                        this.ctx.lineWidth = 1;
                        this.ctx.beginPath();
                        this.ctx.moveTo(x1, y);
                        this.ctx.lineTo(x2, y);
                        this.ctx.stroke();
                    }
                }
            }

            renderIdle() {
                // Render ambient background animation when no audio is playing
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // Pulsing circles
                for (let i = 0; i < 5; i++) {
                    const radius = 50 + i * 30 + Math.sin(this.rotation * 2 + i) * 10;
                    const alpha = 0.1 + Math.sin(this.rotation + i * 0.5) * 0.05;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    this.ctx.strokeStyle = this.getThemeColor('primary', alpha);
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                }
                
                // Floating particles
                this.particles.slice(0, 50).forEach(particle => {
                    particle.x += particle.speedX * 0.5;
                    particle.y += particle.speedY * 0.5;
                    
                    if (particle.x > this.canvas.width) particle.x = 0;
                    if (particle.x < 0) particle.x = this.canvas.width;
                    if (particle.y > this.canvas.height) particle.y = 0;
                    if (particle.y < 0) particle.y = this.canvas.height;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size * 0.5, 0, Math.PI * 2);
                    this.ctx.fillStyle = this.getThemeColor('primary', 0.3);
                    this.ctx.fill();
                });
            }

            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
                this.audio.pause();
                this.audio.src = '';
            }
        }

        // Initialize the visualizer when the page loads
        let visualizer;
        
        window.addEventListener('load', () => {
            visualizer = new MusicVisualizer();
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (visualizer) {
                visualizer.destroy();
            }
        });

        // Handle visibility change for performance optimization
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && visualizer) {
                visualizer.pause();
            }
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (!visualizer) return;
            
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    if (visualizer.isPlaying) {
                        visualizer.pause();
                    } else {
                        visualizer.play();
                    }
                    break;
                case 'Digit1':
                    document.getElementById('mode-select').value = 'bars';
                    visualizer.mode = 'bars';
                    break;
                case 'Digit2':
                    document.getElementById('mode-select').value = 'circular';
                    visualizer.mode = 'circular';
                    break;
                case 'Digit3':
                    document.getElementById('mode-select').value = 'particles';
                    visualizer.mode = 'particles';
                    break;
                case 'Digit4':
                    document.getElementById('mode-select').value = 'waveform';
                    visualizer.mode = 'waveform';
                    break;
                case 'Digit5':
                    document.getElementById('mode-select').value = 'spiral';
                    visualizer.mode = 'spiral';
                    break;
                case 'Digit6':
                    document.getElementById('mode-select').value = 'dna';
                    visualizer.mode = 'dna';
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    const sensitivitySlider = document.getElementById('sensitivity');
                    sensitivitySlider.value = Math.min(3, parseFloat(sensitivitySlider.value) + 0.1);
                    visualizer.sensitivity = parseFloat(sensitivitySlider.value);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    const sensitivitySlider2 = document.getElementById('sensitivity');
                    sensitivitySlider2.value = Math.max(0.1, parseFloat(sensitivitySlider2.value) - 0.1);
                    visualizer.sensitivity = parseFloat(sensitivitySlider2.value);
                    break;
            }
        });

        // Add fullscreen functionality
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        // Add touch gestures for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            if (!visualizer) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            // Swipe gestures
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                if (deltaX > 0) {
                    // Swipe right - next theme
                    const currentTheme = visualizer.currentTheme;
                    const nextTheme = (currentTheme + 1) % visualizer.themes.length;
                    visualizer.setTheme(nextTheme);
                } else {
                    // Swipe left - previous theme
                    const currentTheme = visualizer.currentTheme;
                    const prevTheme = currentTheme === 0 ? visualizer.themes.length - 1 : currentTheme - 1;
                    visualizer.setTheme(prevTheme);
                }
            } else if (Math.abs(deltaY) > 50) {
                if (deltaY < 0) {
                    // Swipe up - increase sensitivity
                    const sensitivitySlider = document.getElementById('sensitivity');
                    sensitivitySlider.value = Math.min(3, parseFloat(sensitivitySlider.value) + 0.2);
                    visualizer.sensitivity = parseFloat(sensitivitySlider.value);
                } else {
                    // Swipe down - decrease sensitivity
                    const sensitivitySlider = document.getElementById('sensitivity');
                    sensitivitySlider.value = Math.max(0.1, parseFloat(sensitivitySlider.value) - 0.2);
                    visualizer.sensitivity = parseFloat(sensitivitySlider.value);
                }
            }
        });

        // Add double-tap to play/pause
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 500 && tapLength > 0 && visualizer) {
                e.preventDefault();
                if (visualizer.isPlaying) {
                    visualizer.pause();
                } else {
                    visualizer.play();
                }
            }
            lastTap = currentTime;
        });

        // Enhanced error handling
        window.addEventListener('error', (e) => {
            console.error('Visualizer error:', e.error);
            document.getElementById('loading').classList.add('hidden');
        });

        // Performance monitoring
        const performanceMonitor = {
            frameDrops: 0,
            lastFrameTime: performance.now(),
            
            checkPerformance() {
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastFrameTime;
                
                if (deltaTime > 33.33) { // 30fps threshold
                    this.frameDrops++;
                    
                    // Auto-adjust quality if performance is poor
                    if (this.frameDrops > 10 && visualizer) {
                        if (visualizer.mode === 'particles' && visualizer.particles.length > 100) {
                            visualizer.particles = visualizer.particles.slice(0, 100);
                        }
                    }
                }
                
                this.lastFrameTime = currentTime;
            }
        };

        // Audio context resume handler for mobile
        document.addEventListener('touchstart', async () => {
            if (visualizer && visualizer.audioContext && visualizer.audioContext.state === 'suspended') {
                try {
                    await visualizer.audioContext.resume();
                } catch (error) {
                    console.warn('Could not resume audio context:', error);
                }
            }
        }, { once: true });

        // Add visual feedback for controls
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const value = e.target.value;
                const min = e.target.min;
                const max = e.target.max;
                const percentage = ((value - min) / (max - min)) * 100;
                
                e.target.style.background = `linear-gradient(to right, 
                    rgba(102, 126, 234, 0.8) 0%, 
                    rgba(102, 126, 234, 0.8) ${percentage}%, 
                    rgba(255, 255, 255, 0.2) ${percentage}%, 
                    rgba(255, 255, 255, 0.2) 100%)`;
            });
        });

        // Initialize slider backgrounds
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            const value = slider.value;
            const min = slider.min;
            const max = slider.max;
            const percentage = ((value - min) / (max - min)) * 100;
            
            slider.style.background = `linear-gradient(to right, 
                rgba(102, 126, 234, 0.8) 0%, 
                rgba(102, 126, 234, 0.8) ${percentage}%, 
                rgba(255, 255, 255, 0.2) ${percentage}%, 
                rgba(255, 255, 255, 0.2) 100%)`;
        });
    </script>
</body>
</html>
